<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#586B33">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <h1 id="appTitle">Ahlak Rehberim</h1>
    <div class="header-actions">
      <div class="flag-bar" id="langSwitch">
        <button type="button" data-lang="tr" class="active" aria-label="Türkçe">🇹🇷</button>
        <button type="button" data-lang="de" aria-label="Deutsch">🇩🇪</button>
        <button type="button" data-lang="en" aria-label="English">🇬🇧</button>
        <button type="button" data-lang="ar" aria-label="العربية">🇸🇦</button>
      </div>
      <button type="button" id="installBtn">📲 Yükle</button>
    </div>
  </div>

  <div class="search-bar">
    <div class="search-input-wrap">
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Marka veya firma yazın...">
      <button type="button" id="clearSearchBtn" aria-label="Temizle">✕</button>
    </div>
    <button type="button" id="barcodeBtn">📷 Barkod</button>
  </div>
</header>

<main class="container">
  <nav class="filter-pills" id="quickFilters">
    <button type="button" data-status="" class="active" id="fAll">Tümü</button>
    <button type="button" data-status="review" id="fReview">🔴 İnceleme</button>
    <button type="button" data-status="preferred" id="fPreferred">🟢 Tercih Edilebilir</button>
    <button type="button" data-status="alt" id="fAlt">⭐ Alternatifli</button>
  </nav>

  <div class="dropdown-row">
    <select id="categoryFilter" aria-label="Kategori"><option value="">Tüm Kategoriler</option></select>
    <select id="companyFilter" aria-label="Ana Firma"><option value="">Tüm Ana Firmalar</option></select>
  </div>

  <div class="status-line">
    <span id="listLabel">Markalar</span>
    <span id="resultCount">Yükleniyor...</span>
  </div>

  <section class="brand-list" id="brandGrid"></section>

  <div class="load-more-wrap">
    <button type="button" id="loadMoreBtn" style="display:none;">Daha Fazla Göster</button>
  </div>

  <footer class="footer-links">
    <a href="hakkinda.html">Hakkında</a>
    <a href="kaynak-politikasi.html">Kaynak Politikası</a>
    <a href="duzeltme-politikasi.html">Düzeltme</a>
    <a href="gizlilik-politikasi.html">Gizlilik</a>
    <a href="hukuki-bilgilendirme.html">Hukuki Bilgilendirme</a>
  </footer>
</main>

<dialog id="detailDialog">
  <div class="dialog-top">
    <button type="button" class="close-btn" id="closeDialog" aria-label="Kapat">✕</button>
  </div>
  <div class="dialog-body" id="detailBody"></div>
</dialog>

<dialog id="barcodeDialog">
  <div class="dialog-top">
    <button type="button" class="close-btn" id="closeBarcodeDialog" aria-label="Kapat">✕</button>
  </div>
  <div class="dialog-body">
    <h2 id="bcTitle">📷 Barkod Tara</h2>
    <video id="barcodeVideo" playsinline muted></video>
    <p id="barcodeStatus" class="card-meta"></p>
    <div class="manual-bc">
      <input id="manualBarcodeInput" type="tel" inputmode="numeric" placeholder="Barkod numarasını yazın...">
      <button type="button" id="manualBarcodeBtn">Ara</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
