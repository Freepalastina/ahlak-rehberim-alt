<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5F7138">
  <title>Ahlak Rehberim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div>
    <h1 id="appTitle">Ahlak Rehberim</h1>
    <p class="sub" id="appSub">Marka, ana firma ve alternatif arama</p>
  </div>
  <div class="heroActions">
    <div class="flagLang" id="langSwitch">
      <button type="button" data-lang="tr" class="active" aria-label="Türkçe">🇹🇷</button>
      <button type="button" data-lang="de" aria-label="Deutsch">🇩🇪</button>
      <button type="button" data-lang="en" aria-label="English">🇬🇧</button>
      <button type="button" data-lang="ar" aria-label="العربية">🇸🇦</button>
    </div>
    <button type="button" id="installBtn">📲 Yükle</button>
  </div>
</header>

<main class="wrap">
  <!-- Große, leicht bedienbare Suchleiste -->
  <section class="searchPanel">
    <div style="position:relative; display:flex; align-items:center; grid-column: 1 / 2;">
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Marka veya firma yazın..." style="padding-right:38px;">
      <button type="button" id="clearSearchBtn" aria-label="Temizle" style="position:absolute; right:8px; border:0; background:transparent; font-size:18px; color:#68705D; cursor:pointer; display:none;">✕</button>
    </div>
    <button type="button" id="barcodeBtn">📷 Barkod</button>
    <select id="categoryFilter" aria-label="Kategori">
      <option value="">Tüm Kategoriler</option>
    </select>
    <select id="companyFilter" aria-label="Ana Firma">
      <option value="">Tüm Ana Firmalar</option>
    </select>
  </section>

  <!-- Kompakte Zähler -->
  <section class="stats" id="statsBar"></section>

  <!-- 3 klare Schnellfilter -->
  <nav class="quick" id="quickFilters">
    <button type="button" data-status="" class="active" id="fAll">Tümü</button>
    <button type="button" data-status="review" id="fReview">🔴 İncelenmesi Önerilir</button>
    <button type="button" data-status="preferred" id="fPreferred">🟢 Tercih Edilebilir</button>
    <button type="button" data-status="alt" id="fAlt">⭐ Alternatifli</button>
  </nav>

  <!-- Ergebnis-Überschrift -->
  <div class="sectionTitle">
    <h2 id="listHeading">Markalar</h2>
    <span id="resultCount">0</span>
  </div>

  <!-- Markenkarten -->
  <section class="grid" id="brandGrid"></section>

  <!-- Mehr laden Button -->
  <div style="text-align:center; margin-top:16px;">
    <button type="button" id="loadMoreBtn" class="dialogBtn" style="background:var(--card); border:1px solid var(--line); color:var(--text); display:none;">Daha Fazla Göster</button>
  </div>

  <!-- Dezente rechtliche Links unten -->
  <footer class="legalLinks">
    <a href="hakkinda.html">Hakkında</a>
    <a href="kaynak-politikasi.html">Kaynak Politikası</a>
    <a href="duzeltme-politikasi.html">Düzeltme</a>
    <a href="gizlilik-politikasi.html">Gizlilik</a>
    <a href="hukuki-bilgilendirme.html">Hukuki Bilgilendirme</a>
  </footer>
</main>

<!-- Detail-Dialog -->
<dialog id="detailDialog">
  <div class="dialogTop">
    <button type="button" id="closeDialog" aria-label="Kapat">✕</button>
  </div>
  <div class="detail" id="detailBody"></div>
</dialog>

<!-- Barcode-Dialog -->
<dialog id="barcodeDialog">
  <div class="dialogTop">
    <button type="button" id="closeBarcodeDialog" aria-label="Kapat">✕</button>
  </div>
  <div class="detail">
    <h2 id="bcTitle">📷 Barkod Tara</h2>
    <video id="barcodeVideo" playsinline muted></video>
    <p id="barcodeStatus" class="meta"></p>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input id="manualBarcodeInput" type="tel" inputmode="numeric" placeholder="Barkod numarasını yazın...">
      <button type="button" id="manualBarcodeBtn" class="dialogBtn" style="background:var(--green); color:#fff;">Ara</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
